[mcp_servers.dual-graph]
command = "/opt/homebrew/bin/mcp-remote"
args = ["http://127.0.0.1:8080/mcp", "--allow-http"]

[mcp_servers.dual-graph.tools.graph_continue]
approval_mode = "approve"

[mcp_servers.dual-graph.tools.graph_read]
approval_mode = "approve"

[mcp_servers.dual-graph.tools.graph_scan]
approval_mode = "approve"

[mcp_servers.tavily-remote-mcp]
command = "/opt/homebrew/bin/mcp-remote"
args = ["https://mcp.tavily.com/mcp/", "--allow-http"]
